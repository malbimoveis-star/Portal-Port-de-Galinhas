<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Seja um Afiliado - Portal Porto de Galinhas</title>
<meta name="description" content="Cadastre-se como afiliado do Portal Porto de Galinhas e ganhe 50% de comissao sobre cada plano de comerciante que voce indicar." />
<meta name="robots" content="index, follow" />
<link rel="canonical" href="https://portal-porto-galinhas.onrender.com/pages/cadastro-afiliado.html" />
<link rel="icon" href="../assets/icons/logo-tucano.svg" />
<link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
<div id="layout-header"></div>

<div class="pagina" style="max-width: 480px;">
<div class="card">
<h1 id="formTitulo">Seja um Afiliado</h1>
<p style="margin-bottom:16px; color: var(--cinza-texto, #666);">Cadastre-se de graca, receba seu link de indicacao proprio e ganhe <strong>50% de comissao</strong> sobre o valor de cada plano de comerciante que voce indicar para o Portal Porto de Galinhas.</p>

<div id="mensagemErro" class="alerta alerta--erro" style="display:none;"></div>
<div id="mensagemSucesso" class="alerta alerta--sucesso" style="display:none;"></div>

<form id="formCadastro">
<div class="form-grupo">
<label>Nome completo</label>
<input type="text" id="campoNome" required />
</div>
<div class="form-grupo">
<label>E-mail</label>
<input type="email" id="campoEmail" required />
</div>
<div class="form-grupo">
<label>Senha</label>
<div class="campo-senha-wrapper">
<input type="password" id="campoSenha" required minlength="6" />
<button type="button" class="btn-toggle-senha" data-alvo="campoSenha" aria-label="Mostrar senha">👁️</button>
</div>
</div>
<button type="submit" class="btn btn--verde" style="width:100%;">Cadastrar como afiliado</button>
</form>

<p style="text-align:center; margin-top:16px;">
<a href="login-afiliado.html">Ja sou afiliado, quero entrar</a>
</p>
</div>
</div>

<div id="layout-rodape"></div>

<script src="../js/config.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/auth-afiliado.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => window.authAfiliado.initCadastro());
</script>
</body>
</html>
