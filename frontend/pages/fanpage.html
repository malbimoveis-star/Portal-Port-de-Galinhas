<!-- frontend/pages/fanpage.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Fanpage</title>
  <link rel="stylesheet" href="../css/fanpage.css">
</head>
<body>
  <!-- Capa e logo -->
  <div class="fanpage-header">
    <img id="fanpage-cover" class="fanpage-cover" alt="Capa">
    <img id="fanpage-logo" class="fanpage-logo" alt="Logo">
  </div>

  <!-- Nome e categoria -->
  <h1 id="fanpage-nome"></h1>
  <h2 id="fanpage-categoria"></h2>

  <!-- Informações principais -->
  <div class="fanpage-info">
    <p><strong>Endereço:</strong> <span id="fanpage-endereco"></span></p>
    <p><strong>Telefone:</strong> <span id="fanpage-telefone"></span></p>
    <p><strong>WhatsApp:</strong> <span id="fanpage-whatsapp"></span></p>
    <p><strong>Email:</strong> <span id="fanpage-email"></span></p>
    <p><strong>Horário:</strong> <span id="fanpage-horario"></span></p>
  </div>

  <!-- Botões de ação -->
  <div class="fanpage-actions">
    <a id="btn-reservar" class="btn">Reservar</a>
    <a id="btn-ligar" class="btn">Ligar</a>
    <a id="btn-whatsapp" class="btn">Enviar Mensagem</a>
  </div>

  <!-- Galeria -->
  <div id="fanpage-galeria" class="fanpage-galeria"></div>

  <!-- Feed de posts -->
  <div id="fanpage-feed" class="fanpage-feed"></div>

  <!-- Avaliações -->
  <div id="fanpage-avaliacoes" class="fanpage-avaliacoes"></div>

  <!-- Mapa -->
  <iframe id="fanpage-mapa" class="fanpage-mapa" width="100%" height="300" frameborder="0"></iframe>

  <script src="../js/fanpage.js"></script>
</body>
</html>
