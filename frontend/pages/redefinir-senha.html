<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redefinir senha - Portal Porto de Galinhas</title>
  <link rel="icon" href="../assets/icons/logo-tucano.svg" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div id="layout-header"></div>

  <div class="pagina" style="max-width: 480px;">
    <div class="card">
      <h1>Redefinir senha</h1>

      <div id="mensagemErro" class="alerta alerta--erro" style="display:none;"></div>
      <div id="mensagemSucesso" class="alerta alerta--sucesso" style="display:none;"></div>

      <form id="formRedefinirSenha">
        <div class="form-grupo">
          <label>Nova senha</label>
          <div class="campo-senha-wrapper">
            <input type="password" id="campoSenha" required minlength="6" />
            <button type="button" class="btn-toggle-senha" data-alvo="campoSenha" aria-label="Mostrar senha">👁️</button>
          </div>
        </div>
        <div class="form-grupo">
          <label>Confirmar nova senha</label>
          <div class="campo-senha-wrapper">
            <input type="password" id="campoSenhaConfirma" required minlength="6" />
            <button type="button" class="btn-toggle-senha" data-alvo="campoSenhaConfirma" aria-label="Mostrar senha">👁️</button>
          </div>
        </div>
        <button type="submit" class="btn btn--laranja" style="width:100%;">Redefinir senha</button>
      </form>

      <p style="text-align:center; margin-top:16px;">
        <a href="login-comerciante.html">Voltar para o login</a>
      </p>
    </div>
  </div>

  <div id="layout-rodape"></div>

  <script src="../js/config.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/redefinir-senha.js"></script>
</body>
</html>
