<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login do Afiliado - Portal Porto de Galinhas</title>
<meta name="robots" content="index, follow" />
<link rel="canonical" href="https://portal-porto-galinhas.onrender.com/pages/login-afiliado.html" />
<link rel="icon" href="../assets/icons/logo-tucano.svg" />
<link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
<div id="layout-header"></div>

<div class="pagina" style="max-width: 480px;">
<div class="card">
<h1 id="formTitulo">Entrar (Afiliado)</h1>

<div id="mensagemErro" class="alerta alerta--erro" style="display:none;"></div>

<form id="formLogin">
<div class="form-grupo">
<label>E-mail</label>
<input type="email" id="campoEmail" required />
</div>
<div class="form-grupo">
<label>Senha</label>
<div class="campo-senha-wrapper">
<input type="password" id="campoSenha" required />
<button type="button" class="btn-toggle-senha" data-alvo="campoSenha" aria-label="Mostrar senha">👁️</button>
</div>
</div>
<button type="submit" class="btn btn--verde" style="width:100%;">Entrar</button>
</form>

<p style="text-align:center; margin-top:16px;">
<a href="/cadastro-afiliado">Ainda nao sou afiliado, quero me cadastrar</a>
</p>
</div>
</div>

<div id="layout-rodape"></div>

<script src="../js/config.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/auth-afiliado.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => window.authAfiliado.initLogin());
</script>
</body>
</html>
