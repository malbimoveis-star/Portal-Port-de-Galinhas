<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login do Comerciante - Portal Porto de Galinhas</title>
    <meta name="description" content="Cadastre seu negocio no Portal Porto de Galinhas gratuitamente: hoteis, pousadas, restaurantes, passeios e comercios. Ganhe visibilidade para turistas com periodo de degustacao gratis." />
  <meta name="keywords" content="cadastrar negocio Porto de Galinhas, anunciar comercio Porto de Galinhas, divulgar pousada Porto de Galinhas, cadastro comerciante, login comerciante Portal Porto de Galinhas, degustacao gratuita anuncio" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://portal-porto-galinhas.onrender.com/pages/cadastro-comerciante.html" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://portal-porto-galinhas.onrender.com/pages/cadastro-comerciante.html" />
  <meta property="og:title" content="Cadastro do Comerciante - Portal Porto de Galinhas" />
  <meta property="og:description" content="Cadastre seu negocio no Portal Porto de Galinhas gratuitamente e ganhe visibilidade para turistas." />
  <meta property="og:image" content="https://portal-porto-galinhas.onrender.com/assets/icons/logo-tucano.svg" />
  <meta property="og:locale" content="pt_BR" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Cadastro do Comerciante - Portal Porto de Galinhas" />
  <meta name="twitter:description" content="Cadastre seu negocio no Portal Porto de Galinhas gratuitamente e ganhe visibilidade." />
  <link rel="icon" href="../assets/icons/logo-tucano.svg" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div id="layout-header"></div>

  <div class="pagina" style="max-width: 480px;">
    <div class="card">
      <h1 id="formTitulo" data-i18n="painel.login">Entrar</h1>

      <div id="mensagemErro" class="alerta alerta--erro" style="display:none;"></div>

      <form id="formLogin">
        <div class="form-grupo">
          <label data-i18n="painel.email">E-mail</label>
          <input type="email" id="campoEmail" required />
        </div>
        <div class="form-grupo">
          <label data-i18n="painel.senha">Senha</label>
          <div class="campo-senha-wrapper">
            <input type="password" id="campoSenha" required />
            <button type="button" class="btn-toggle-senha" data-alvo="campoSenha" aria-label="Mostrar senha">👁️</button>
          </div>
        </div>
        <button type="submit" class="btn btn--laranja" style="width:100%;" data-i18n="painel.login">Entrar</button>
      </form>

      <p style="text-align:center; margin-top:16px;">
        <a href="cadastro-comerciante.html" data-i18n="painel.nao_tenho_conta">Nao tenho conta, quero me cadastrar</a>
      </p>
      <p style="text-align:center; margin-top:8px;">
        <a href="esqueci-senha.html">Esqueci minha senha?</a>
      </p>
    </div>
  </div>

  <div id="layout-rodape"></div>

  <script src="../js/config.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/auth-comerciante.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => window.authComerciante.initLogin());
  </script>
</body>
</html>
