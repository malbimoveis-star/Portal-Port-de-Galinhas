<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo — Portal Porto de Galinhas</title>
  <link rel="icon" href="/assets/icons/logo-tucano.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #f5f7fa; color: #1a1a2e; line-height: 1.6; min-height: 100vh; }
    a { text-decoration: none; color: inherit; }
    button { cursor: pointer; font-family: inherit; }

    #telaLogin { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .login-card { background: #fff; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); padding: 40px; width: 100%; max-width: 420px; }
    .login-card h1 { font-size: 1.5rem; margin-bottom: 8px; color: #0f3460; }
    .login-card p { color: #666; margin-bottom: 24px; font-size: 0.95rem; }

    .campo { margin-bottom: 16px; }
    .campo label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #444; }
    .campo input, .campo select, .campo textarea { width: 100%; padding: 12px 14px; border: 1.5px solid #dde1e7; border-radius: 10px; font-size: 1rem; transition: border-color 0.2s, box-shadow 0.2s; }
    .campo input:focus, .campo select:focus, .campo textarea:focus { outline: none; border-color: #e94560; box-shadow: 0 0 0 3px rgba(233,69,96,0.1); }
    .campo textarea { resize: vertical; min-height: 80px; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 20px; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 600; transition: transform 0.15s, opacity 0.15s; }
    .btn:hover { transform: translateY(-1px); opacity: 0.9; }
    .btn--principal { background: linear-gradient(135deg, #e94560, #c73e54); color: #fff; }
    .btn--secundario { background: #eef2f7; color: #0f3460; }
    .btn--perigo { background: #dc3545; color: #fff; }
    .btn--sucesso { background: #28a745; color: #fff; }

    .erro { color: #dc3545; font-size: 0.9rem; margin-bottom: 12px; min-height: 1.2em; }

    .admin-header { background: #0f3460; color: #fff; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
    .admin-header h1 { font-size: 1.25rem; }
    .admin-header .usuario {
      <div class="blog-form">
            <div class="campo"><label for="editarAnuncioTitulo">Título do anúncio</label><input type="text" id="editarAnuncioTitulo" placeholder="Digite o título do anúncio"></div>
            <div class="campo"><label for="editarAnuncioDescricao">Descrição</label><textarea id="editarAnuncioDescricao" rows="6" placeholder="Digite a descrição do anúncio"></textarea></div>
            <div class="campo"><label for="editarAnuncioTelefone">Telefone</label><input type="text" id="editarAnuncioTelefone" placeholder="Digite o telefone"></div>
            <div class="campo"><label for="editarAnuncioEndereco">Endereço</label><input type="text" id="editarAnuncioEndereco" placeholder="Digite o endereço"></div>
            <div class="campo"><label for="editarAnuncioLatitude">Latitude</label><input type="text" id="editarAnuncioLatitude" placeholder="Ex.: -8.5069"></div>
            <div class="campo"><label for="editarAnuncioLongitude">Longitude</label><input type="text" id="editarAnuncioLongitude" placeholder="Ex.: -35.0068"></div>
            <div class="campo">
              <label for="editarAnuncioStatus">Status</label>
              <select id="editarAnuncioStatus">
                <option value="pendente">Pendente</option>
                <option value="ativo">Ativo</option>
                <option value="rejeitado">Rejeitado</option>
              </select>
            </div>
            <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:15px;">
              <button type="button" id="btnSalvarEdicaoAnuncio" class="btn btn--principal">Salvar alterações</button>
              <button type="button" id="btnCancelarEdicaoAnuncio" class="btn btn--secundario">Cancelar edição</button>
            </div>
          </div>
        </div>
      </section>

      <!-- EDITAR CATEGORIA -->
      <section id="tabEditarCategoria" class="escondido">
        <div class="card">
          <h2>Editar categoria</h2>
          <p>Altere os dados da categoria selecionada.</p>
          <input type="hidden" id="editarCategoriaId" value="">
          <p id="erroEditarCategoria" class="erro"></p>
          <div class="blog-form">
            <div class="campo"><label for="editarCategoriaNome">Nome da categoria</label><input type="text" id="editarCategoriaNome" placeholder="Digite o nome da categoria"></div>
            <div class="campo"><label for="editarCategoriaIcone">URL do ícone</label><input type="text" id="editarCategoriaIcone" placeholder="https://..."></div>
            <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:15px;">
              <button type="button" id="btnSalvarEdicaoCategoria" class="btn btn--principal">Salvar alterações</button>
              <button type="button" id="btnCancelarEdicaoCategoria" class="btn btn--secundario">Cancelar edição</button>
            </div>
          </div>
        </div>
      </section>

      <!-- EDITAR ARTIGO DO BLOG -->
      <section id="tabEditarBlog" class="escondido">
        <div class="card">
          <h2>Editar artigo</h2>
          <p>Edite o artigo selecionado.</p>
          <input type="hidden" id="editarBlogId" value="">
          <input type="hidden" id="editarBlogConteudo" value="">
          <p id="erroEditarBlog" class="erro"></p>
          <div class="blog-form">
            <div class="campo"><label for="editarBlogTitulo">Título</label><input type="text" id="editarBlogTitulo" placeholder="Digite o título"></div>
            <div class="campo"><label for="editarBlogResumo">Resumo</label><textarea id="editarBlogResumo" rows="4" placeholder="Digite o resumo"></textarea></div>
            <div class="campo"><label for="editarBlogCapa">URL da capa</label><input type="text" id="editarBlogCapa" placeholder="https://..."></div>
            <div class="campo">
              <label>Conteúdo</label>
              <div class="wp-editor-wrap">
                <div class="wp-toolbar">
                  <select id="editFmtBlock" onchange="if(this.value){wpFormat('editarBlogConteudoEditor','formatBlock',this.value);}this.value='';">
                    <option value="">Parágrafo</option>
                    <option value="H1">Título H1</option>
                    <option value="H2">Título H2</option>
                    <option value="H3">Título H3</option>
                    <option value="H4">Título H4</option>
                    <option value="BLOCKQUOTE">Citação</option>
                    <option value="PRE">Código</option>
                  </select>
                  <span class="sep"></span>
                  <button type="button" onclick="wpFormat('editarBlogConteudoEditor','bold')" title="Negrito (Ctrl+B)"><b>B</b></button>
                  <button type="button" onclick="wpFormat('editarBlogConteudoEditor','italic')" title="Itálico (Ctrl+I)"><i>I</i></button>
                  <button type="button" onclick="wpFormat('editarBlogConteudoEditor','underline')" title="Sublinhado (Ctrl+U)"><u>U</u></button>
                  <button type="button" onclick="wpFormat('editarBlogConteudoEditor','strikeThrough')" title="Tachado"><s>S</s></button>
                  <span class="sep"></span>
                  <button type="button" onclick="wpFormat('editarBlogConteudoEditor','insertUnorderedList')" title="Lista com marcadores">• Lista</button>
                  <button type="button" onclick="wpFormat('editarBlogConteudoEditor','insertOrderedList')" title="Lista numerada">1. Lista</button>
                  <span class="sep"></span>
                  <button type="button" onclick="wpInsertLink('editarBlogConteudoEditor')" title="Inserir link">🔗 Link</button>
                  <button type="button" onclick="wpInsertImage('editarBlogConteudoEditor')" title="Inserir imagem">🖼️ Imagem</button>
                  <span class="sep"></span>
                  <button type="button" onclick="wpFormat('editarBlogConteudoEditor','removeFormat')" title="Limpar formatação">🧹 Limpar</button>
                </div>
                <div id="editarBlogConteudoEditor" class="wp-editor" contenteditable="true" data-placeholder="Comece a escrever seu artigo aqui..."></div>
              </div>
            </div>
            <div class="campo">
              <label for="editarBlogPublicado">Publicação</label>
              <select id="editarBlogPublicado">
                <option value="1">Publicado</option>
                <option value="0">Rascunho</option>
              </select>
            </div>
            <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:15px;">
              <button type="button" id="btnSalvarEdicaoBlog" class="btn btn--principal">Salvar alterações</button>
              <button type="button" id="btnCancelarEdicaoBlog" class="btn btn--secundario">Cancelar edição</button>
            </div>
          </div>
        </div>
      </section>

    </main>
  </div>

  <script>
  (function() {
    'use strict';
    const API_BASE = '/api';
    let token = localStorage.getItem('admin_token') || '';

    const telaLogin = document.getElementById('telaLogin');
    const telaDashboard = document.getElementById('telaDashboard');
    const loginUsuario = document.getElementById('loginUsuario');
    const loginSenha = document.getElementById('loginSenha');
    const btnEntrar = document.getElementById('btnEntrar');
    const erroLogin = document.getElementById('erroLogin');
    const btnSair = document.getElementById('btnSair');

    const abas = {
      anuncios: document.getElementById('abaAnuncios'),
      categorias: document.getElementById('abaCategorias'),
      comerciantes: document.getElementById('abaComerciantes'),
      blog: document.getElementById('abaBlog')
    };
    const navButtons = document.querySelectorAll('.admin-nav button[data-aba]');
    const tabEditarAnuncio = document.getElementById('tabEditarAnuncio');
    const tabEditarCategoria = document.getElementById('tabEditarCategoria');
    const tabEditarBlog = document.getElementById('tabEditarBlog');

    function mostrarErro(el, msg) { el.textContent = msg || ''; }
    function esconder(el) { el.classList.add('escondido'); }
    function mostrar(el) { el.classList.remove('escondido'); }

    /* ===== EDITOR WYSIWYG — FUNÇÕES GLOBAIS ===== */
    window.wpFormat = function(editorId, command, value) {
      const editor = document.getElementById(editorId);
      if (editor) {
        editor.focus();
        document.execCommand(command, false, value || null);
      }
    };
    window.wpInsertLink = function(editorId) {
      const editor = document.getElementById(editorId);
      if (!editor) return;
      editor.focus();
      const url = prompt('Digite a URL do link:');
      if (url) { document.execCommand('createLink', false, url); }
    };
    window.wpInsertImage = function(editorId) {
      const editor = document.getElementById(editorId);
      if (!editor) return;
      editor.focus();
      const url = prompt('Digite a URL da imagem:');
      if (url) { document.execCommand('insertImage', false, url); }
    };
    /* ===== FIM EDITOR ===== */

    async function apiGet(path) {
      const r = await fetch(API_BASE + path, { headers: token ? { 'Authorization': 'Bearer ' + token } : {} });
      if (!r.ok) { let m = 'Erro ' + r.status; try { const e = await r.json(); if (e.erro) m = e.erro; } catch(x){} throw new Error(m); }
      return r.json();
    }
    async function apiPost(path, body) {
      const r = await fetch(API_BASE + path, { method: 'POST', headers: { 'Content-Type': 'application/json', ...(token ? { 'Authorization': 'Bearer ' + token } : {}) }, body: JSON.stringify(body) });
      if (!r.ok) { let m = 'Erro ' + r.status; try { const e = await r.json(); if (e.erro) m = e.erro; } catch(x){} throw new Error(m); }
      return r.json();
    }
    async function apiPut(path, body) {
      const r = await fetch(API_BASE + path, { method: 'PUT', headers: { 'Content-Type': 'application/json', ...(token ? { 'Authorization': 'Bearer ' + token } : {}) }, body: JSON.stringify(body) });
      if (!r.ok) { let m = 'Erro ' + r.status; try { const e = await r.json(); if (e.erro) m = e.erro; } catch(x){} throw new Error(m); }
      return r.json();
    }
    async function apiDelete(path) {
      const r = await fetch(API_BASE + path, { method: 'DELETE', headers: token ? { 'Authorization': 'Bearer ' + token } : {} });
      if (!r.ok) { let m = 'Erro ' + r.status; try { const e = await r.json(); if (e.erro) m = e.erro; } catch(x){} throw new Error(m); }
      return r.json();
    }

    async function fazerLogin() {
      mostrarErro(erroLogin, '');
      const usuario = loginUsuario.value.trim();
      const senha = loginSenha.value.trim();
      if (!usuario || !senha) { mostrarErro(erroLogin, 'Preencha usuário e senha.'); return; }
      try {
        const data = await apiPost('/login', { usuario, senha });
        if (data.token) {
          token = data.token;
          localStorage.setItem('admin_token', token);
          mostrarDashboard();
        } else {
          mostrarErro(erroLogin, 'Credenciais inválidas.');
        }
      } catch (e) {
        mostrarErro(erroLogin, e.message || 'Erro ao fazer login. Verifique as credenciais.');
      }
    }

    function mostrarDashboard() {
      esconder(telaLogin);
      mostrar(telaDashboard);
      carregarAnunciosPendentes();
      carregarAnunciosTodos();
      carregarCategorias();
      carregarComerciantes();
      carregarBlog();
    }

    function fazerLogout() {
      token = '';
      localStorage.removeItem('admin_token');
      esconder(telaDashboard);
      mostrar(telaLogin);
      loginUsuario.value = '';
      loginSenha.value = '';
    }

    navButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        navButtons.forEach(b => b.classList.remove('ativo'));
        btn.classList.add('ativo');
        const aba = btn.dataset.aba;
        Object.values(abas).forEach(a => esconder(a));
        esconder(tabEditarAnuncio);
        esconder(tabEditarCategoria);
        esconder(tabEditarBlog);
        if (abas[aba]) mostrar(abas[aba]);
      });
    });

    async function carregarAnunciosPendentes() {
      const container = document.getElementById('listaAnunciosPendentes');
      try {
        const data = await apiGet('/admin/anuncios');
        const anuncios = data.anuncios || data || [];
        const pendentes = anuncios.filter(a => a.status === 'pendente');
        if (pendentes.length === 0) { container.innerHTML = '<div class="vazio">Nenhum anúncio pendente.</div>'; return; }
        container.innerHTML = renderTabelaAnuncios(pendentes, true);
        bindAcoesAnuncios();
      } catch (e) { container.innerHTML = '<div class="vazio">Erro ao carregar anúncios.</div>'; }
    }

    async function carregarAnunciosTodos() {
      const container = document.getElementById('listaAnunciosTodos');
      try {
        const data = await apiGet('/admin/anuncios/todos');
        const anuncios = data.anuncios || data || [];
        if (anuncios.length === 0) { container.innerHTML = '<div class="vazio">Nenhum anúncio cadastrado.</div>'; return; }
        container.innerHTML = renderTabelaAnuncios(anuncios, false);
        bindAcoesAnuncios();
      } catch (e) { container.innerHTML = '<div class="vazio">Erro ao carregar anúncios.</div>'; }
    }

    function renderTabelaAnuncios(anuncios, mostrarAcoesRapidas) {
      const linhas = anuncios.map(a => {
        const statusClass = 'badge--' + (a.status || 'pendente');
        const acoes = mostrarAcoesRapidas
          ? '<div class="acoes"><button class="btn btn--sucesso btn-aprovar" data-id="' + a.id + '">Aprovar</button><button class="btn btn--perigo btn-rejeitar" data-id="' + a.id + '">Rejeitar</button></div>'
          : '<div class="acoes"><button class="btn btn--secundario btn-editar" data-id="' + a.id + '">Editar</button><button class="btn btn--perigo btn-excluir" data-id="' + a.id + '">Excluir</button></div>';
        return '<tr><td>' + a.id + '</td><td><strong>' + escapeHtml(a.titulo || '—') + '</strong></td><td>' + escapeHtml(a.comerciante_nome || a.comerciante_email || '—') + '</td><td><span class="badge ' + statusClass + '">' + (a.status || 'pendente') + '</span></td><td>' + acoes + '</td></tr>';
      }).join('');
      return '<table><thead><tr><th>ID</th><th>Título</th><th>Comerciante</th><th>Status</th><th>Ações</th></tr></thead><tbody>' + linhas + '</tbody></table>';
    }

    function bindAcoesAnuncios() {
      document.querySelectorAll('.btn-aprovar').forEach(btn => {
        btn.addEventListener('click', async () => {
          try { await apiPut('/admin/anuncios/' + btn.dataset.id + '/aprovar', {}); carregarAnunciosPendentes(); carregarAnunciosTodos(); }
          catch (e) { alert('Erro ao aprovar.'); }
        });
      });
      document.querySelectorAll('.btn-rejeitar').forEach(btn => {
        btn.addEventListener('click', async () => {
          try { await apiPut('/admin/anuncios/' + btn.dataset.id + '/rejeitar', {}); carregarAnunciosPendentes(); carregarAnunciosTodos(); }
          catch (e) { alert('Erro ao rejeitar.'); }
        });
      });
      document.querySelectorAll('.btn-editar').forEach(btn => {
        btn.addEventListener('click', () => abrirEdicaoAnuncio(btn.dataset.id));
      });
      document.querySelectorAll('.btn-excluir').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!confirm('Tem certeza que deseja excluir este anúncio?')) return;
          try { await apiDelete('/admin/anuncios/' + btn.dataset.id); carregarAnunciosTodos(); }
          catch (e) { alert('Erro ao excluir.'); }
        });
      });
    }

    async function abrirEdicaoAnuncio(id) {
      mostrarErro(document.getElementById('erroEditarAnuncio'), '');
      try {
        const data = await apiGet('/admin/anuncios/todos');
        const anuncios = data.anuncios || data || [];
        const anuncio = anuncios.find(a => String(a.id) === String(id));
        if (!anuncio) { alert('Anúncio não encontrado.'); return; }
        document.getElementById('editarAnuncioId').value = anuncio.id;
        document.getElementById('editarAnuncioTitulo').value = anuncio.titulo || '';
        document.getElementById('editarAnuncioDescricao').value = anuncio.descricao || '';
        document.getElementById('editarAnuncioTelefone').value = anuncio.telefone || '';
        document.getElementById('editarAnuncioEndereco').value = anuncio.endereco || '';
        document.getElementById('editarAnuncioLatitude').value = anuncio.latitude || '';
        document.getElementById('editarAnuncioLongitude').value = anuncio.longitude || '';
        document.getElementById('editarAnuncioStatus').value = anuncio.status || 'pendente';
        Object.values(abas).forEach(a => esconder(a));
        esconder(tabEditarCategoria);
        esconder(tabEditarBlog);
        mostrar(tabEditarAnuncio);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (e) { alert('Erro ao carregar anúncio para edição.'); }
    }

    document.getElementById('btnSalvarEdicaoAnuncio').addEventListener('click', async () => {
      const id = document.getElementById('editarAnuncioId').value;
      const body = {
        titulo: document.getElementById('editarAnuncioTitulo').value,
        descricao: document.getElementById('editarAnuncioDescricao').value,
        telefone: document.getElementById('editarAnuncioTelefone').value,
        endereco: document.getElementById('editarAnuncioEndereco').value,
        latitude: document.getElementById('editarAnuncioLatitude').value,
        longitude: document.getElementById('editarAnuncioLongitude').value,
        status: document.getElementById('editarAnuncioStatus').value,
      };
      try {
        await apiPut('/admin/anuncios/' + id, body);
        esconder(tabEditarAnuncio);
        mostrar(abas.anuncios);
        carregarAnunciosTodos();
        carregarAnunciosPendentes();
      } catch (e) { mostrarErro(document.getElementById('erroEditarAnuncio'), 'Erro ao salvar alterações.'); }
    });

    document.getElementById('btnCancelarEdicaoAnuncio').addEventListener('click', () => {
      esconder(tabEditarAnuncio);
      mostrar(abas.anuncios);
    });

    async function carregarCategorias() {
      const container = document.getElementById('listaCategorias');
      try {
        const data = await apiGet('/categorias');
        const cats = data.categorias || data || [];
        if (cats.length === 0) { container.innerHTML = '<div class="vazio">Nenhuma categoria cadastrada.</div>'; return; }
        const linhas = cats.map(c => '<tr><td>' + c.id + '</td><td><strong>' + escapeHtml(c.nome) + '</strong></td><td>' + (c.icone_url ? '<img src="' + escapeHtml(c.icone_url) + '" style="width:24px;height:24px;">' : '—') + '</td><td><div class="acoes"><button class="btn btn--secundario btn-editar-cat" data-id="' + c.id + '" data-nome="' + escapeHtml(c.nome) + '" data-icone="' + escapeHtml(c.icone_url || '') + '">Editar</button><button class="btn btn--perigo btn-excluir-cat" data-id="' + c.id + '">Excluir</button></div></td></tr>').join('');
        container.innerHTML = '<table><thead><tr><th>ID</th><th>Nome</th><th>Ícone</th><th>Ações</th></tr></thead><tbody>' + linhas + '</tbody></table>';
        document.querySelectorAll('.btn-editar-cat').forEach(btn => {
          btn.addEventListener('click', () => {
            document.getElementById('editarCategoriaId').value = btn.dataset.id;
            document.getElementById('editarCategoriaNome').value = btn.dataset.nome;
            document.getElementById('editarCategoriaIcone').value = btn.dataset.icone;
            mostrarErro(document.getElementById('erroEditarCategoria'), '');
            Object.values(abas).forEach(a => esconder(a));
            esconder(tabEditarAnuncio);
            esconder(tabEditarBlog);
            mostrar(tabEditarCategoria);
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
        });
        document.querySelectorAll('.btn-excluir-cat').forEach(btn => {
          btn.addEventListener('click', async () => {
            if (!confirm('Tem certeza que deseja excluir esta categoria?')) return;
            try { await apiDelete('/admin/categorias/' + btn.dataset.id); carregarCategorias(); }
            catch (e) { alert('Erro ao excluir categoria.'); }
          });
        });
      } catch (e) { container.innerHTML = '<div class="vazio">Erro ao carregar categorias.</div>'; }
    }

    document.getElementById('btnCriarCategoria').addEventListener('click', async () => {
      const nome = document.getElementById('novaCategoriaNome').value.trim();
      const icone = document.getElementById('novaCategoriaIcone').value.trim();
      const erroEl = document.getElementById('erroNovaCategoria');
      if (!nome) { mostrarErro(erroEl, 'Digite o nome da categoria.'); return; }
      try {
        await apiPost('/admin/categorias', { nome, icone_url: icone });
        document.getElementById('novaCategoriaNome').value = '';
        document.getElementById('novaCategoriaIcone').value = '';
        mostrarErro(erroEl, '');
        carregarCategorias();
      } catch (e) { mostrarErro(erroEl, e.message || 'Erro ao criar categoria.'); }
    });

    document.getElementById('btnSalvarEdicaoCategoria').addEventListener('click', async () => {
      const id = document.getElementById('editarCategoriaId').value;
      const body = { nome: document.getElementById('editarCategoriaNome').value, icone_url: document.getElementById('editarCategoriaIcone').value };
      try {
        await apiPut('/admin/categorias/' + id, body);
        esconder(tabEditarCategoria);
        mostrar(abas.categorias);
        carregarCategorias();
      } catch (e) { mostrarErro(document.getElementById('erroEditarCategoria'), 'Erro ao salvar categoria.'); }
    });

    document.getElementById('btnCancelarEdicaoCategoria').addEventListener('click', () => {
      esconder(tabEditarCategoria);
      mostrar(abas.categorias);
    });

    async function carregarComerciantes() {
      const container = document.getElementById('listaComerciantes');
      try {
        const data = await apiGet('/comerciantes');
        const coms = data.comerciantes || data || [];
        if (coms.length === 0) { container.innerHTML = '<div class="vazio">Nenhum comerciante cadastrado.</div>'; return; }
        const linhas = coms.map(c => {
          const statusClass = 'badge--' + (c.status || 'ativo');
          return '<tr><td>' + c.id + '</td><td><strong>' + escapeHtml(c.nome || '—') + '</strong></td><td>' + escapeHtml(c.email || '—') + '</td><td>' + escapeHtml(c.telefone || '—') + '</td><td><span class="badge ' + statusClass + '">' + (c.status || 'ativo') + '</span></td></tr>';
        }).join('');
        container.innerHTML = '<table><thead><tr><th>ID</th><th>Nome</th><th>E-mail</th><th>Telefone</th><th>Status</th></tr></thead><tbody>' + linhas + '</tbody></table>';
      } catch (e) { container.innerHTML = '<div class="vazio">Erro ao carregar comerciantes.</div>'; }
    }

    /* ===== BLOG ===== */
    async function carregarBlog() {
      const container = document.getElementById('listaBlog');
      container.innerHTML = '<div class="vazio">Carregando artigos...</div>';
      try {
        const artigos = await apiGet('/blog/admin');
        if (!Array.isArray(artigos) || artigos.length === 0) { container.innerHTML = '<div class="vazio">Nenhum artigo cadastrado.</div>'; return; }
        const linhas = artigos.map(artigo => {
          const publicado = Number(artigo.publicado) === 1;
          const statusClass = publicado ? 'badge--publicado' : 'badge--rascunho';
          const statusTexto = publicado ? 'Publicado' : 'Rascunho';
          const capa = artigo.capa_url ? '<img class="blog-capa-preview" src="' + escapeHtml(artigo.capa_url) + '" alt="Capa">' : '—';
          return '<tr><td>' + artigo.id + '</td><td><strong>' + escapeHtml(artigo.titulo || 'Sem título') + '</strong><div class="artigo-conteudo-preview">' + escapeHtml(artigo.resumo || '') + '</div></td><td>' + capa + '</td><td><span class="badge ' + statusClass + '">' + statusTexto + '</span></td><td>' + escapeHtml(artigo.criado_em || '—') + '</td><td><div class="acoes"><button class="btn btn--secundario btn-editar-blog" data-id="' + artigo.id + '">Editar</button><button class="btn btn--perigo btn-excluir-blog" data-id="' + artigo.id + '">Excluir</button></div></td></tr>';
        }).join('');
        container.innerHTML = '<table><thead><tr><th>ID</th><th>Artigo</th><th>Capa</th><th>Status</th><th>Data</th><th>Ações</th></tr></thead><tbody>' + linhas + '</tbody></table>';
        document.querySelectorAll('.btn-editar-blog').forEach(btn => {
          btn.addEventListener('click', () => abrirEdicaoBlog(btn.dataset.id));
        });
        document.querySelectorAll('.btn-excluir-blog').forEach(btn => {
          btn.addEventListener('click', async () => {
            if (!confirm('Tem certeza que deseja excluir este artigo?')) return;
            try { await apiDelete('/blog/' + btn.dataset.id); carregarBlog(); }
            catch (e) { alert(e.message || 'Erro ao excluir artigo.'); }
          });
        });
      } catch (e) { console.error('[BLOG ADMIN]', e); container.innerHTML = '<div class="vazio">Erro ao carregar artigos do blog.</div>'; }
    }

    document.getElementById('btnCriarArtigo').addEventListener('click', async () => {
      const titulo = document.getElementById('novoArtigoTitulo').value.trim();
      const resumo = document.getElementById('novoArtigoResumo').value.trim();
      const capa_url = document.getElementById('novoArtigoCapa').value.trim();
      const conteudo = document.getElementById('novoArtigoConteudoEditor').innerHTML;
      const publicado = document.getElementById('novoArtigoPublicado').value;
      const erroEl = document.getElementById('erroNovoArtigo');
      mostrarErro(erroEl, '');
      if (!titulo) { mostrarErro(erroEl, 'Digite o título do artigo.'); return; }
      if (!conteudo.trim() || conteudo === '<p><br></p>' || conteudo === '<br>') { mostrarErro(erroEl, 'Digite o conteúdo do artigo.'); return; }
      try {
        await apiPost('/blog', { titulo, resumo, capa_url, conteudo, publicado: Number(publicado) });
        document.getElementById('novoArtigoTitulo').value = '';
        document.getElementById('novoArtigoResumo').value = '';
        document.getElementById('novoArtigoCapa').value = '';
        document.getElementById('novoArtigoConteudoEditor').innerHTML = '';
        document.getElementById('novoArtigoPublicado').value = '1';
        mostrarErro(erroEl, '');
        alert('Artigo criado com sucesso.');
        carregarBlog();
      } catch (e) { mostrarErro(erroEl, e.message || 'Erro ao criar artigo.'); }
    });

    async function abrirEdicaoBlog(id) {
      mostrarErro(document.getElementById('erroEditarBlog'), '');
      try {
        const artigo = await apiGet('/blog/admin/' + id);
        document.getElementById('editarBlogId').value = artigo.id;
        document.getElementById('editarBlogTitulo').value = artigo.titulo || '';
        document.getElementById('editarBlogResumo').value = artigo.resumo || '';
        document.getElementById('editarBlogCapa').value = artigo.capa_url || '';
        document.getElementById('editarBlogConteudo').value = artigo.conteudo || '';
        document.getElementById('editarBlogPublicado').value = Number(artigo.publicado) === 1 ? '1' : '0';
        Object.values(abas).forEach(a => esconder(a));
        esconder(tabEditarAnuncio);
        esconder(tabEditarCategoria);
        mostrar(tabEditarBlog);
        window.scrollTo({ top: 0, behavior: 'smooth' });
        setTimeout(() => {
          const editor = document.getElementById('editarBlogConteudoEditor');
          if (editor) { editor.innerHTML = artigo.conteudo || ''; }
        }, 50);
      } catch (e) { alert(e.message || 'Erro ao carregar artigo para edição.'); }
    }

    document.getElementById('btnSalvarEdicaoBlog').addEventListener('click', async () => {
      const id = document.getElementById('editarBlogId').value;
      const titulo = document.getElementById('editarBlogTitulo').value.trim();
      const resumo = document.getElementById('editarBlogResumo').value.trim();
      const capa_url = document.getElementById('editarBlogCapa').value.trim();
      const conteudo = document.getElementById('editarBlogConteudoEditor').innerHTML;
      const publicado = document.getElementById('editarBlogPublicado').value;
      const erroEl = document.getElementById('erroEditarBlog');
      mostrarErro(erroEl, '');
      if (!titulo) { mostrarErro(erroEl, 'Digite o título do artigo.'); return; }
      if (!conteudo.trim() || conteudo === '<p><br></p>' || conteudo === '<br>') { mostrarErro(erroEl, 'Digite o conteúdo do artigo.'); return; }
      try {
        await apiPut('/blog/' + id, { titulo, resumo, capa_url, conteudo, publicado: Number(publicado) });
        esconder(tabEditarBlog);
        mostrar(abas.blog);
        carregarBlog();
        alert('Artigo atualizado com sucesso.');
      } catch (e) { mostrarErro(erroEl, e.message || 'Erro ao atualizar artigo.'); }
    });

    document.getElementById('btnCancelarEdicaoBlog').addEventListener('click', () => {
      esconder(tabEditarBlog);
      mostrar(abas.blog);
    });
    /* ===== FIM BLOG ===== */

    function escapeHtml(text) {
      if (text == null) return '';
      return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    btnEntrar.addEventListener('click', fazerLogin);
    loginSenha.addEventListener('keydown', e => { if (e.key === 'Enter') fazerLogin(); });
    btnSair.addEventListener('click', fazerLogout);

    if (token) { mostrarDashboard(); } else { mostrar(telaLogin); esconder(telaDashboard); }
  })();
  </script>
</body>
</html>
